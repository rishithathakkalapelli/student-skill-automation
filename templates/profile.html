{% extends "base.html" %}{% block title %}Profile | SkillBridge{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-card"><span class="eyebrow">STUDENT DETAILS</span><h2 class="fw-bold mt-2">Edit profile</h2><form method="post"><label class="form-label">Full name</label><input class="form-control mb-3" name="name" value="{{ user['name'] }}" required><label class="form-label">Email</label><input class="form-control mb-3" value="{{ user['email'] }}" disabled><label class="form-label">Branch / Department</label><input class="form-control mb-3" name="branch" value="{{ user['branch'] }}"><label class="form-label">Current year</label><input class="form-control mb-4" name="year" value="{{ user['year'] }}"><button class="btn btn-primary w-100">Save changes</button></form></div></div>{% endblock %}
