{% extends "base.html" %}{% block title %}Login | SkillBridge{% endblock %}
{% block content %}<div class="form-wrap"><div class="form-card"><span class="eyebrow">WELCOME BACK</span><h2 class="fw-bold mt-2">Login to SkillBridge</h2><p class="text-secondary">Continue building your career profile.</p>
<form method="post"><label class="form-label">Email</label><input class="form-control mb-3" type="email" name="email" required><label class="form-label">Password</label><input class="form-control mb-4" type="password" name="password" required><button class="btn btn-primary w-100">Login</button></form><p class="small text-secondary mt-3 mb-0">New here? <a href="{{ url_for('register') }}">Create an account</a></p></div></div>{% endblock %}
